name: flight price crawler

# Runs the crawler once a day. It checks Google Flights, Decolar and LATAM
# for the Rio-Buenos Aires (Aeroparque) route, appends the results to the
# CSV, and regenerates docs/data.json for the GitHub Pages dashboard.
# Commits both files back to main so the page always shows the latest run.
#
# GitHub Pages itself is not set up by this workflow. Settings -> Pages ->
# Build and deployment -> Source: "Deploy from a branch", branch main,
# folder /docs, is a one-time step done by hand.

on:
  schedule:
    - cron: "0 11 * * *" # 08:00 America/Sao_Paulo (UTC-3)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run crawler
        run: python crawler.py
        # A site can block a run (bot protection) without breaking the
        # others. The crawler already records that row as status=error, so
        # the job commits what it got instead of failing the whole run.
        continue-on-error: true

      - name: Commit updated price data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add precos_rio_buenosaires.csv docs/data.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update flight price data ($(date -u +%F))"
          git push
